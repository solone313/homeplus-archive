<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 137 137">
  <!-- 사이___집 mark — wine-red, transparent bg
       viewBox 137x137 = saijip-mark.png height squared
       paths approximate the 3 shapes scaled to fill viewBox -->
  <g fill="#7c1d1d">
    <!-- Triangle (left): peak at top-mid-left, base at bottom -->
    <path d="M5 130 L58 8 L58 130 Z" />
    <!-- Bar (center): thin vertical -->
    <rect x="63" y="8" width="11" height="122" />
    <!-- Trapezoid (right): top slanted, bottom flat -->
    <path d="M79 60 L132 18 L132 130 L79 130 Z" />
  </g>
</svg>
